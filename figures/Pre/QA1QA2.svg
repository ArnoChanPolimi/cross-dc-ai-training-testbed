ly="Calibri,Calibri_MSFontService,sans-serif" font-weight="700" font-size="83" transform="matrix(1 0 0 1 2628.2 1611)">but communication must now </text><text font-family="Calibri,Calibri_MSFontService,sans-serif" font-weight="700" font-size="83" transform="matrix(1 0 0 1 1738.78 1710)">traverse a dynamic WAN.</text><text font-family="Calibri,Calibri_MSFontService,sans-serif" font-weight="700" font-size="83" transform="matrix(1 0 0 1 1896.56 1837)">Higher latency · Uneven bandwidth · Background traffic</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="700" viewBox="0 0 1320 700" role="img" aria-labelledby="title desc">
  <title id="title">From distributed AI training to the network</title>
  <desc id="desc">A layered view from PyTorch FSDP through collective communication and RoCEv2 to a programmable multipath WAN.</desc>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fbff"/><stop offset="1" stop-color="#edf5fb"/>
    </linearGradient>
    <filter id="s2" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-opacity="0.16"/></filter>
    <marker id="down" markerWidth="10" markerHeight="10" refX="5" refY="8" orient="auto"><path d="M0,0 L10,0 L5,10 z" fill="#58768f"/></marker>
  </defs>
  <rect width="1320" height="700" rx="26" fill="url(#bg2)"/>
  <text x="660" y="55" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="30" font-weight="800" fill="#17334c">From a training step to packets on the WAN</text>
  <text x="660" y="88" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" fill="#58768f">Each layer answers a different part of the same communication problem.</text>

  <g filter="url(#s2)" font-family="Inter,Segoe UI,Arial,sans-serif">
    <rect x="110" y="135" width="1100" height="92" rx="20" fill="#4451a8"/>
    <circle cx="165" cy="181" r="27" fill="#fff" opacity="0.18"/>
    <text x="165" y="190" text-anchor="middle" fill="white" font-size="26" font-weight="800">1</text>
    <text x="225" y="174" fill="white" font-size="24" font-weight="800">Distributed training — PyTorch FSDP</text>
    <text x="225" y="204" fill="#e9ebff" font-size="17">Shards model state across GPU workers and requests communication during each training step.</text>

    <rect x="110" y="260" width="1100" height="92" rx="20" fill="#3976b9"/>
    <circle cx="165" cy="306" r="27" fill="#fff" opacity="0.18"/>
    <text x="165" y="315" text-anchor="middle" fill="white" font-size="26" font-weight="800">2</text>
    <text x="225" y="299" fill="white" font-size="24" font-weight="800">Collective communication — NCCL / MSCCL</text>
    <text x="225" y="329" fill="#e8f5ff" font-size="17">Turns operations such as All-Gather into coordinated transfers between GPU workers.</text>

    <rect x="110" y="385" width="1100" height="92" rx="20" fill="#198f94"/>
    <circle cx="165" cy="431" r="27" fill="#fff" opacity="0.18"/>
    <text x="165" y="440" text-anchor="middle" fill="white" font-size="26" font-weight="800">3</text>
    <text x="225" y="424" fill="white" font-size="24" font-weight="800">High-performance transport — RoCEv2 RDMA</text>
    <text x="225" y="454" fill="#e4ffff" font-size="17">Carries collective data through RDMA-capable network interfaces between nodes.</text>

    <rect x="110" y="510" width="1100" height="112" rx="20" fill="#e2a43a"/>
    <circle cx="165" cy="566" r="27" fill="#fff" opacity="0.24"/>
    <text x="165" y="575" text-anchor="middle" fill="white" font-size="26" font-weight="800">4</text>
    <text x="225" y="552" fill="#17334c" font-size="24" font-weight="800">Programmable multipath WAN</text>
    <text x="225" y="582" fill="#31495c" font-size="17">Controls the bandwidth, delay, queues, background load, and paths seen by the training traffic.</text>
    <text x="225" y="607" fill="#31495c" font-size="17">This is where stable datacenter assumptions meet time-varying wide-area conditions.</text>
  </g>
  <g stroke="#58768f" stroke-width="4" fill="none" marker-end="url(#down)">
    <path d="M660 231 L660 250"/><path d="M660 356 L660 375"/><path d="M660 481 L660 500"/>
  </g>
  <text x="660" y="667" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#17334c">The project studies the complete stack—not an isolated benchmark.</text>
</svg>

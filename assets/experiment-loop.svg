<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="600" viewBox="0 0 1400 600" role="img" aria-labelledby="title desc">
  <title id="title">Repeatable experiment loop</title>
  <desc id="desc">Configure a workload and WAN, run training, observe the system, compare behavior, and refine the design.</desc>
  <defs>
    <linearGradient id="b3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071726"/><stop offset="1" stop-color="#15334d"/></linearGradient>
    <filter id="sh3" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-opacity="0.3"/></filter>
    <marker id="arr3" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#76cfe8"/></marker>
  </defs>
  <rect width="1400" height="600" rx="26" fill="url(#b3)"/>
  <text x="700" y="58" text-anchor="middle" fill="#f6fbff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="31" font-weight="800">A repeatable systems experiment—not a one-off demo</text>
  <text x="700" y="91" text-anchor="middle" fill="#a9c6d9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">The loop connects controlled inputs to observable training and network behavior.</text>

  <g fill="none" stroke="#76cfe8" stroke-width="5" marker-end="url(#arr3)">
    <path d="M330 205 C410 130 505 120 575 165"/>
    <path d="M815 165 C895 120 995 130 1070 205"/>
    <path d="M1145 330 C1125 425 1035 472 940 452"/>
    <path d="M740 475 C655 535 555 518 500 455"/>
    <path d="M260 405 C185 355 190 265 250 225"/>
  </g>

  <g font-family="Inter,Segoe UI,Arial,sans-serif" filter="url(#sh3)">
    <g transform="translate(90 160)">
      <rect width="260" height="132" rx="20" fill="#4253a8"/>
      <text x="130" y="42" text-anchor="middle" fill="white" font-size="20" font-weight="800">1 · Configure workload</text>
      <text x="130" y="76" text-anchor="middle" fill="#e8ebff" font-size="16">GPU workers, model shape,</text>
      <text x="130" y="101" text-anchor="middle" fill="#e8ebff" font-size="16">collective payload</text>
    </g>
    <g transform="translate(455 105)">
      <rect width="290" height="132" rx="20" fill="#286dac"/>
      <text x="145" y="42" text-anchor="middle" fill="white" font-size="20" font-weight="800">2 · Configure WAN</text>
      <text x="145" y="76" text-anchor="middle" fill="#e6f4ff" font-size="16">Paths, bandwidth, delay,</text>
      <text x="145" y="101" text-anchor="middle" fill="#e6f4ff" font-size="16">queues, background traffic</text>
    </g>
    <g transform="translate(880 160)">
      <rect width="300" height="132" rx="20" fill="#168d91"/>
      <text x="150" y="42" text-anchor="middle" fill="white" font-size="20" font-weight="800">3 · Run real training</text>
      <text x="150" y="76" text-anchor="middle" fill="#e6ffff" font-size="16">Execute the complete FSDP,</text>
      <text x="150" y="101" text-anchor="middle" fill="#e6ffff" font-size="16">collective, RDMA, WAN path</text>
    </g>
    <g transform="translate(835 385)">
      <rect width="315" height="132" rx="20" fill="#d69b34"/>
      <text x="157" y="42" text-anchor="middle" fill="#172c3e" font-size="20" font-weight="800">4 · Observe the system</text>
      <text x="157" y="76" text-anchor="middle" fill="#283f52" font-size="16">Training time, collectives,</text>
      <text x="157" y="101" text-anchor="middle" fill="#283f52" font-size="16">paths, rates, queues</text>
    </g>
    <g transform="translate(355 385)">
      <rect width="315" height="132" rx="20" fill="#b86972"/>
      <text x="157" y="42" text-anchor="middle" fill="white" font-size="20" font-weight="800">5 · Compare and refine</text>
      <text x="157" y="76" text-anchor="middle" fill="#fff0f2" font-size="16">Reproduce conditions, isolate</text>
      <text x="157" y="101" text-anchor="middle" fill="#fff0f2" font-size="16">bottlenecks, test the next design</text>
    </g>
  </g>
  <circle cx="700" cy="305" r="95" fill="#10283d" stroke="#55d6be" stroke-width="3"/>
  <text x="700" y="290" text-anchor="middle" fill="#55d6be" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="800">Repeatable</text>
  <text x="700" y="319" text-anchor="middle" fill="#f2fbff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="800">cross-layer</text>
  <text x="700" y="348" text-anchor="middle" fill="#f2fbff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="800">experiments</text>
</svg>

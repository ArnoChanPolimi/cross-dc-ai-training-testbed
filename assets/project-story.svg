<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="620" viewBox="0 0 1440 620" role="img" aria-labelledby="title desc">
  <title id="title">The cross-datacenter AI training story</title>
  <desc id="desc">GPU workers in two datacenters communicate through a changing WAN. A programmable testbed makes the complete system observable and repeatable.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081526"/>
      <stop offset="1" stop-color="#102c46"/>
    </linearGradient>
    <linearGradient id="wan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22c1c3"/>
      <stop offset="1" stop-color="#4f8cff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity="0.25"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#85d9ff"/>
    </marker>
  </defs>
  <rect width="1440" height="620" rx="28" fill="url(#bg)"/>
  <text x="720" y="58" text-anchor="middle" fill="#f7fbff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="30" font-weight="700">Why cross-datacenter training becomes a systems problem</text>
  <text x="720" y="91" text-anchor="middle" fill="#a9c4d9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">Computation is distributed across GPUs, but every training step still depends on communication.</text>

  <g filter="url(#shadow)">
    <rect x="70" y="140" width="330" height="305" rx="24" fill="#f7fbff"/>
    <rect x="1040" y="140" width="330" height="305" rx="24" fill="#f7fbff"/>
  </g>
  <text x="235" y="185" text-anchor="middle" fill="#19324a" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700">Logical Datacenter 1</text>
  <text x="1205" y="185" text-anchor="middle" fill="#19324a" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700">Logical Datacenter 2</text>

  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <g transform="translate(105 220)">
      <rect width="115" height="92" rx="14" fill="#e7f0ff" stroke="#4f8cff" stroke-width="3"/>
      <rect x="18" y="20" width="79" height="38" rx="7" fill="#4f8cff"/>
      <circle cx="31" cy="72" r="6" fill="#22c1c3"/><circle cx="51" cy="72" r="6" fill="#22c1c3"/>
      <text x="57" y="47" text-anchor="middle" fill="white" font-size="18" font-weight="700">GPU 0</text>
    </g>
    <g transform="translate(250 220)">
      <rect width="115" height="92" rx="14" fill="#e7f0ff" stroke="#4f8cff" stroke-width="3"/>
      <rect x="18" y="20" width="79" height="38" rx="7" fill="#4f8cff"/>
      <circle cx="31" cy="72" r="6" fill="#22c1c3"/><circle cx="51" cy="72" r="6" fill="#22c1c3"/>
      <text x="57" y="47" text-anchor="middle" fill="white" font-size="18" font-weight="700">GPU 1</text>
    </g>
    <g transform="translate(1075 220)">
      <rect width="115" height="92" rx="14" fill="#e7f0ff" stroke="#4f8cff" stroke-width="3"/>
      <rect x="18" y="20" width="79" height="38" rx="7" fill="#4f8cff"/>
      <circle cx="31" cy="72" r="6" fill="#22c1c3"/><circle cx="51" cy="72" r="6" fill="#22c1c3"/>
      <text x="57" y="47" text-anchor="middle" fill="white" font-size="18" font-weight="700">GPU 2</text>
    </g>
    <g transform="translate(1220 220)">
      <rect width="115" height="92" rx="14" fill="#e7f0ff" stroke="#4f8cff" stroke-width="3"/>
      <rect x="18" y="20" width="79" height="38" rx="7" fill="#4f8cff"/>
      <circle cx="31" cy="72" r="6" fill="#22c1c3"/><circle cx="51" cy="72" r="6" fill="#22c1c3"/>
      <text x="57" y="47" text-anchor="middle" fill="white" font-size="18" font-weight="700">GPU 3</text>
    </g>
  </g>
  <text x="235" y="355" text-anchor="middle" fill="#37536a" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18">Compute one shared training job</text>
  <text x="235" y="385" text-anchor="middle" fill="#37536a" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18">and exchange model data</text>
  <text x="1205" y="355" text-anchor="middle" fill="#37536a" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18">Compute one shared training job</text>
  <text x="1205" y="385" text-anchor="middle" fill="#37536a" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18">and exchange model data</text>

  <path d="M405 252 C520 170, 590 190, 675 250" fill="none" stroke="#4f8cff" stroke-width="8" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M1035 252 C920 170, 850 190, 765 250" fill="none" stroke="#22c1c3" stroke-width="8" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M405 350 C540 455, 900 455, 1035 350" fill="none" stroke="#f0b44d" stroke-width="7" stroke-dasharray="16 12" stroke-linecap="round"/>

  <g filter="url(#shadow)">
    <path d="M548 202 C570 151 632 138 676 168 C712 112 798 116 826 174 C886 151 940 190 931 247 C976 276 958 346 902 353 L551 353 C493 344 480 273 526 244 C520 226 529 210 548 202Z" fill="url(#wan)"/>
  </g>
  <text x="720" y="244" text-anchor="middle" fill="white" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="30" font-weight="800">Changing WAN</text>
  <text x="720" y="280" text-anchor="middle" fill="#eafaff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">Bandwidth · delay · queues</text>
  <text x="720" y="306" text-anchor="middle" fill="#eafaff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">background traffic · multiple paths</text>

  <g filter="url(#shadow)">
    <rect x="284" y="485" width="872" height="92" rx="20" fill="#132f49" stroke="#55d6be" stroke-width="2"/>
  </g>
  <text x="720" y="523" text-anchor="middle" fill="#55d6be" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700">The testbed turns changing network conditions into controlled experiments</text>
  <text x="720" y="553" text-anchor="middle" fill="#d8e9f5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">Run real training · reproduce WAN conditions · observe the full communication path</text>
</svg>
